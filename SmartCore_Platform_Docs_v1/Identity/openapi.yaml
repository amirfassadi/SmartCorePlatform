components:
  schemas:
    StartRegistration:
      type: object
      properties:
        email: &id008
          type: string
          format: email
          maxLength: 254
        mobile: &id009
          type: string
          pattern: ^\+[1-9][0-9]{1,14}$
        password: &id005
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
        displayName: &id010
          type: string
          minLength: 1
          maxLength: 100
        bindingSecret: &id003
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          writeOnly: true
          description: Base64url unpadded encoding of 32 random bytes.
      required:
      - password
      - displayName
      - bindingSecret
      additionalProperties: false
      oneOf: &id011
      - required:
        - email
        not:
          required:
          - mobile
      - required:
        - mobile
        not:
          required:
          - email
    VerifyRegistration:
      type: object
      properties:
        verificationSessionId: *id001
        code: &id004
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
        bindingSecret: *id003
      required:
      - verificationSessionId
      - code
      - bindingSecret
      additionalProperties: false
    ResendVerification:
      type: object
      properties:
        verificationSessionId: *id001
        bindingSecret: *id003
      required:
      - verificationSessionId
      - bindingSecret
      additionalProperties: false
    CompleteRegistration:
      type: object
      properties:
        setupChallengeId: *id001
        code: *id004
        bindingSecret: *id003
        newPassword: *id005
      required:
      - setupChallengeId
      - code
      - bindingSecret
      - newPassword
      additionalProperties: false
    VerificationPending:
      type: object
      properties:
        verificationSessionId: *id001
        expiresAt: &id006
          type: string
          format: date-time
        status:
          const: AwaitingVerification
      required:
      - verificationSessionId
      - expiresAt
      - status
      additionalProperties: false
    SetupPending:
      type: object
      properties:
        setupChallengeId: *id001
        expiresAt: *id006
        status:
          const: Accepted
      required:
      - setupChallengeId
      - expiresAt
      - status
      additionalProperties: false
    Accepted:
      type: object
      properties:
        status:
          const: Accepted
      required:
      - status
      additionalProperties: false
    RegistrationResult:
      type: object
      properties:
        registrationId: &id007
          type: string
          format: uuid
        status:
          enum:
          - PendingCredential
          - Ready
        ownershipCommittedAt: *id006
        readyAt: *id006
      required:
      - registrationId
      - status
      - ownershipCommittedAt
      additionalProperties: false
      allOf:
      - if:
          properties:
            status:
              const: Ready
        then:
          required:
          - readyAt
        else:
          not:
            required:
            - readyAt
    Person:
      type: object
      properties:
        personId: *id007
        email: *id008
        mobile: *id009
        displayName: *id010
        status:
          enum:
          - Active
          - Suspended
          - Archived
        createdAt: *id006
        updatedAt: *id006
      required:
      - personId
      - displayName
      - status
      - createdAt
      - updatedAt
      additionalProperties: false
      oneOf: *id011
    Organization:
      type: object
      properties:
        organizationId: *id007
        name: *id002
        category:
          const: Personal
        status:
          const: Active
        createdAt: *id006
      required:
      - organizationId
      - name
      - category
      - status
      - createdAt
      additionalProperties: false
    Membership:
      type: object
      properties:
        membershipId: *id007
        personId: *id007
        organizationId: *id007
        role:
          const: Owner
        status:
          const: Active
        createdAt: *id006
      required:
      - membershipId
      - personId
      - organizationId
      - role
      - status
      - createdAt
      additionalProperties: false
    SessionTokens:
      type: object
      properties:
        sessionId: *id007
        accessToken: *id002
        refreshToken: *id002
        expiresAt: *id006
      required:
      - sessionId
      - accessToken
      - refreshToken
      - expiresAt
      additionalProperties: false
    SessionSummary:
      type: object
      properties:
        sessionId: *id007
        deviceInfo: *id002
        ipAddress: *id002
        expiresAt: *id006
        status:
          const: Active
        createdAt: *id006
      required:
      - sessionId
      - expiresAt
      - status
      - createdAt
      additionalProperties: false
    Login:
      type: object
      properties:
        email: *id008
        mobile: *id009
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        deviceInfo: *id002
      required:
      - password
      additionalProperties: false
      oneOf: *id011
    LoginResult:
      type: object
      properties:
        person:
          $ref: '#/components/schemas/Person'
        session:
          $ref: '#/components/schemas/SessionTokens'
      required:
      - person
      - session
      additionalProperties: false
    Logout:
      type: object
      properties:
        sessionId: *id007
      required:
      - sessionId
      additionalProperties: false
    Refresh:
      type: object
      properties:
        refreshToken:
          type: string
          writeOnly: true
      required:
      - refreshToken
      additionalProperties: false
    UpdateProfile:
      type: object
      properties:
        displayName: *id010
      required:
      - displayName
      additionalProperties: false
    ChangePassword:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword: *id005
      required:
      - currentPassword
      - newPassword
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id002
            message: *id002
            nextAction:
              enum:
              - RequestSetup
              - SignIn
          required:
          - code
          - message
          additionalProperties: false
        traceId: *id002
      required:
      - error
      - traceId
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
