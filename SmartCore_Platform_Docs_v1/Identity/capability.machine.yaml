aggregates:
- name: Person
  repository: PersonRepository
  narrative: 01_Domain_Model.md
  requiredAttributes:
  - PersonId
  - DisplayName
  - Status
  - CreatedAt
  - UpdatedAt
  optionalAttributes:
  - Email
  - Mobile
  contactInvariant: exactly one verified Email or Mobile; contact mutation outside
    MVP
- name: Organization
  repository: OrganizationRepository
  narrative: 01_Domain_Model.md
  requiredAttributes:
  - OrganizationId
  - Name
  - Category
  - Status
  - CreatedAt
  optionalAttributes: []
- name: Membership
  repository: MembershipRepository
  narrative: 01_Domain_Model.md
  requiredAttributes:
  - MembershipId
  - PersonId
  - OrganizationId
  - Role
  - Status
  - CreatedAt
  optionalAttributes: []
- name: Credential
  repository: CredentialRepository
  narrative: 01_Domain_Model.md
  requiredAttributes:
  - CredentialId
  - PersonId
  - PasswordHash
  - PasswordVersion
  - Status
  - CreatedAt
  optionalAttributes: []
  invariant: at most one active per Person; zero permitted before Ready
- name: Session
  repository: SessionRepository
  narrative: 01_Domain_Model.md
  requiredAttributes:
  - SessionId
  - PersonId
  - AccessTokenId
  - RefreshTokenId
  - ExpiresAt
  - Status
  - CreatedAt
  optionalAttributes:
  - DeviceInfo
  - IpAddress
commands:
- name: RegisterPerson
  service: RegistrationApplicationService
  operations:
  - StartRegistration
  - VerifyRegistration
  - ResendVerification
  - RequestSetup
  - CompleteRegistration
  narrative: 04_Commands.md
- name: AuthenticatePerson
  service: AuthenticationDomainService
  operations:
  - AuthenticatePerson
  narrative: 04_Commands.md
- name: UpdatePersonProfile
  service: PersonManagementDomainService
  operations:
  - UpdatePersonProfile
  narrative: 04_Commands.md
- name: LogoutSession
  service: SessionManagementDomainService
  operations:
  - LogoutSession
  narrative: 04_Commands.md
- name: RefreshSession
  service: SessionManagementDomainService
  operations:
  - RefreshSession
  narrative: 04_Commands.md
- name: ChangePassword
  service: CredentialManagementDomainService
  operations:
  - ChangePassword
  narrative: 04_Commands.md
