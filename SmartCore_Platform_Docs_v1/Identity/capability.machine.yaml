  occurredAt: CommittedFact
  stream: OwnLifecycleOrAudit
- name: SessionExpired
  classification: DomainEvent
  producer: SessionManagementDomainService
  schema: events.schema.json#/$defs/SessionExpired
  occurredAt: CommittedFact
  stream: OwnLifecycleOrAudit
- name: LogoutCompleted
  classification: DomainEvent
  producer: SessionManagementDomainService
  schema: events.schema.json#/$defs/LogoutCompleted
  occurredAt: CommittedFact
  stream: OwnLifecycleOrAudit
- name: PersonUpdated
