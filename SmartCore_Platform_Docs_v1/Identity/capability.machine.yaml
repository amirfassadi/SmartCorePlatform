contracts:
  rest:
    version: 1.1.0
    schema: openapi.yaml
    narrative: 08_API.md
  events:
    version: 1.2.0
    schema: events.schema.json
    narrative: 06_Domain_Events.md
  services:
  - name: IdentityLookup
    version: '1'
    operations:
    - GetPersonById
    narrative: 07_Contracts.md
    schemas:
    - services.schema.json#/$defs/GetPersonByIdRequest
    - services.schema.json#/$defs/GetPersonByIdResult
  - name: CredentialProvisioning
    version: '1'
    operations:
    - EnsureInitialCredential
    - GetInitialCredentialResult
    narrative: 07_Contracts.md
    schemas:
    - services.schema.json#/$defs/EnsureInitialCredentialRequest
    - services.schema.json#/$defs/GetInitialCredentialResultRequest
    - services.schema.json#/$defs/EnsureInitialCredentialResult
    - services.schema.json#/$defs/GetInitialCredentialResultResponse
workflow:
  owner: RegistrationApplicationService
  aggregate: false
  key: registrationId
  states:
  - PendingCredential
  - Ready
  initialTransaction:
  - Person
  - Organization
  - Membership
  - RegistrationWorkflow
  - VerificationConsumption
  - MaterialOwnerBinding
  - ProvisioningOutbox
  - OwnershipEventOutbox
  readyTransaction:
  - WorkflowCAS
  - PersonStreamPosition
  - PersonRegisteredOutbox
  credentialConfirmation: AuthenticatedPolling
  authenticationRequires:
  - PersonActive
  - RegistrationReady
  - CurrentActiveCredential
configuration:
  verificationLifetimeSeconds:
    default: 600
    rule: Absolute from creation; no resend/read extension
  verificationMaxAttempts:
    default: 5
    rule: Cumulative per session, including replay; atomic across workers
  verificationMaxResends:
    default: 3
    rule: Rotate code without resetting expiry/attempt count
  resendMinIntervalSeconds:
    default: 60
    rule: Applies independently of account existence
  setupLifetimeSeconds:
    default: 600
    rule: Absolute; separate purpose/proof from registration
  setupMaxAttempts:
    default: 5
    rule: Includes authorized replay attempts
  secretDeletionDeadlineSeconds:
    default: 300
    rule: Physical/cryptographic disposal after invalidation
  provisioningMaterialLifetimeSeconds:
    default: 3600
    rule: Absolute from ownership commit; never renewed by retries
  provisioningMaxAttempts:
    default: 8
    rule: Includes initial attempt; reconcile uncertain result before retry
  provisioningInitialBackoffSeconds:
    default: 2
    rule: Exponential with jitter
  provisioningMaxBackoffSeconds:
    default: 300
    rule: Cap; no infinite retry loop
  dependencyTimeoutSeconds:
    default: 5
    rule: Fail closed; classify uncertain writes and reconcile
  reconciliationIntervalSeconds:
    default: 30
    rule: Poll pending uncertain outcomes within bounded automated policy
  maxActiveSessionsPerPerson:
    default: 20
    rule: New login at cap fails with capacity error; no unbounded session query
  sessionLifetimeSeconds:
    default: 86400
    rule: Absolute; refresh does not extend
  accessTokenLifetimeSeconds:
    default: 900
    rule: Never beyond Session expiry
  minPasswordLength:
    default: 15
    rule: No silent truncation; allow spaces/Unicode
  maxPasswordLength:
    default: 128
    rule: Bound KDF abuse; explicit validation before staging
  maxDisplayNameLength:
    default: 100
    rule: Nonblank normalized text; output escaping remains mandatory
  maxInitiationsPerContactPerHour:
    default: 5
    rule: Applied to all canonical contacts, existing or not
  maxInitiationsPerIpPerHour:
    default: 30
    rule: Trusted ingress IP; combine with contact/device/global budgets
  maxSetupDeliveriesPerContactPerHour:
    default: 3
    rule: Distinct setup deliveries share a contact budget across fresh verification
      attempts
  maxLoginAttemptsPerContactPer15Minutes:
    default: 10
    rule: All existence states; shared distributed counter
security:
  narrative: 11_Security.md
  otpVerifier: 'HMAC: purpose/session bound'
  proofLengthDigits: 6
  replayAuthorization:
  - sameSuccessfulCode
  - sameBindingSecret
  replayExpiry: originalVerificationExpiry
  optionalJson: omit-not-null
  passwordMaterialInEvents: false
dependencies:
- layer: Core
  purpose: persistence, messaging, service authentication, delivery, KMS
- layer: SharedKernel
  purpose: identifiers and execution context
